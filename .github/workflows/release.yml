name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Pinned to the LTS the dev machines run; must match ci.yml.
env:
  BLENDER_VERSION: "5.2.0"

jobs:
  package-and-publish:
    # Free hosted runner: blender-downloader fetches the pinned Blender
    # build, which is used to verify the packaged zip before publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install blender-downloader

      - name: Cache the extracted Blender build
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-${{ env.BLENDER_VERSION }}
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download and extract Blender ${{ env.BLENDER_VERSION }}
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          # blender-downloader stats the output dir before creating it.
          mkdir -p "${{ runner.temp }}/blender-${BLENDER_VERSION}"
          blender-downloader "$BLENDER_VERSION" -q --extract --remove-compressed \
            -d "${{ runner.temp }}/blender-${BLENDER_VERSION}"
      - name: Put blender on PATH
        run: |
          echo "${{ runner.temp }}/blender-${BLENDER_VERSION}/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
          blender --version | head -1

      - name: Package the extension zip
        run: python3 scripts/package.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dist"

      # The zip is installed into a fresh Blender config with no dev symlink,
      # then the full smoke test runs against it - i.e. the exact third-party
      # path the MVP exit criterion describes, including the demo scenes.
      - name: Install the zip in a fresh Blender and smoke test it
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/release-blender-config
        run: |
          export FLOWX_ZIP=$(ls "$RUNNER_TEMP/dist/"*.zip)
          blender --background --python scripts/smoke_test.py

      - name: Create the GitHub release with the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ZIP=$(ls "$RUNNER_TEMP/dist/"*.zip)
          ZIP_NAME=$(basename "$ZIP")
          AUTH="Authorization: token $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          # Reuse the release if this tag was already published (re-run).
          RELEASE_ID=$(curl -sS -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))")
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -sS -X POST -H "$AUTH" -H "$ACCEPT" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{\"tag_name\": \"$TAG\", \"name\": \"$TAG\", \"body\": \"Flow-X MVP: GPU SPH fluids with a live surface mesh. Install the attached zip from Blender's Extensions window and open a scene from demos/. See README.md.\"}" \
              | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          fi
          curl -sS -X POST -H "$AUTH" -H "$ACCEPT" \
            -H "Content-Type: application/zip" \
            --data-binary @"$ZIP" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ZIP_NAME"
